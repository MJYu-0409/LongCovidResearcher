services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: longcovid-qdrant
    ports:
      - "6333:6333"
    volumes:
      - longcovid_qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: longcovid-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres_adminmjy
      POSTGRES_PASSWORD: adminmjy
      POSTGRES_DB: longcovid
    volumes:
      - longcovid_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: longcovid-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

# external: true 表示使用已有 Docker 卷，不新建，不删除，保留全部数据
volumes:
  longcovid_qdrant_storage:
    external: true
  longcovid_pgdata:
    external: true
